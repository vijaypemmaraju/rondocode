[package]
name = "rondocode-desktop"
version = "0.1.0"
edition = "2021"
description = "rondocode desktop shell: local files + a virtual MIDI port for DAWs"
license = "MIT"
# Name the app binary explicitly. Diagnostics live in examples/, NOT src/bin:
# a second [[bin]] made `tauri build` bundle the wrong executable, so the .app
# launched a CLI that printed and exited, which presents as "crashes on launch".
default-run = "rondocode-desktop"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# CFString only — CoreMIDI itself is bound directly in src/midi.rs
core-foundation = "0.10"

[features]
# by convention for tauri; nothing custom yet
default = []
